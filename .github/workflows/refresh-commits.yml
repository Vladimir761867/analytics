name: Обновить историю разработки

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать панель
        uses: actions/checkout@v4

      - name: Подготовить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Скачать истории проектов
        shell: bash
        run: |
          mkdir -p source
          git clone --filter=blob:none --no-checkout https://github.com/Vladimir761867/winner-app.git source/winner-app
          git clone --filter=blob:none --no-checkout https://github.com/Vladimir761867/football-cage.git source/football-cage
          git clone --filter=blob:none --no-checkout https://github.com/Vladimir761867/path.git source/path
          git clone --filter=blob:none --no-checkout https://github.com/Vladimir761867/Afterburn-Skies.git source/afterburn-skies
          git clone --filter=blob:none --no-checkout https://github.com/Vladimir761867/To-Each-Their-Own-A-Big-Walk.git source/walk

      - name: Пересобрать журнал коммитов
        run: python tools/build_commits.py source/winner-app source/football-cage source/path source/afterburn-skies source/walk

      - name: Сохранить изменения
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/commits.json
          if git diff --cached --quiet; then
            echo "История уже актуальна"
          else
            git commit -m "chore: обновить историю разработки"
            git push
          fi
